name: One-off - top menu AI Content

on:
  push:
    branches: [ai-content-page]
    paths: ['.github/workflows/nav-ai-content.yml']

jobs:
  nav:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Replace Exhibitions with AI Content in the top menu of every page
        run: |
          cat > "$RUNNER_TEMP/nav_ai.py" <<'PYEOF'
          """Top navigation: drop Exhibitions, add AI Content after Videos (header + mobile menu, every page)."""
          import os, re

          changed = 0
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if not d.startswith('.') and d != 'admin']
              for f in files:
                  if not f.endswith('.html'):
                      continue
                  p = os.path.join(root, f)
                  s = open(p, encoding='utf-8').read()
                  if 'class="header__link">AI Content</a>' in s:
                      continue
                  o = s
                  s = re.sub(r'\n[ \t]*<a href="(?:\.\./)*exhibitions/" class="(?:header__link|mobile-nav__link)">Exhibitions</a>', '', s)
                  def add(m):
                      indent, prefix, cls = m.group(1), m.group(2), m.group(3)
                      return m.group(0) + '\n%s<a href="%sai-content/" class="%s">AI Content</a>' % (indent, prefix, cls)
                  s = re.sub(r'(?m)^([ \t]*)<a href="((?:\.\./)*)videos/" class="(header__link|mobile-nav__link)">Videos</a>', add, s)
                  if s != o:
                      open(p, 'w', encoding='utf-8').write(s)
                      changed += 1
          print('pages changed:', changed)
          PYEOF
          python3 "$RUNNER_TEMP/nav_ai.py"

      - name: Commit and remove this one-off workflow
        run: |
          git rm -q .github/workflows/nav-ai-content.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Top menu: replace Exhibitions with AI Content on every page"
          git push
