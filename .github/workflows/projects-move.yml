name: One-off - move /technologies/ to /projects/

on:
  push:
    branches: [projects-page]
    paths: ['.github/workflows/projects-move.yml']

jobs:
  move:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Point every link to projects/ and turn the old page into a redirect
        run: |
          cat > "$RUNNER_TEMP/projects_move.py" <<'PYEOF'
          """Move /technologies/ to /projects/: every link points to projects/, the old address redirects."""
          import os, re

          REDIRECT = '''<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>Projects — Arthemii Ionaere</title>
              <meta name="robots" content="noindex">
              <link rel="canonical" href="https://arthemii.com/projects/">
              <meta http-equiv="refresh" content="0; url=../projects/">
              <script>location.replace('../projects/' + location.hash);</script>
          </head>
          <body>
              <p>This page has moved to <a href="../projects/">Projects</a>.</p>
          </body>
          </html>
          '''
          assert os.path.exists('projects/index.html'), 'upload projects/index.html first'
          with open('technologies/index.html', 'w', encoding='utf-8') as f:
              f.write(REDIRECT)

          changed = 0
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if not d.startswith('.') and d not in ('admin', 'technologies')]
              for name in files:
                  if not name.endswith('.html'):
                      continue
                  p = os.path.join(root, name)
                  s = open(p, encoding='utf-8').read()
                  o = s
                  s = re.sub(r'href="((?:\.\./)*)technologies/"', r'href="\1projects/"', s)
                  if p == './index.html':
                      s = s.replace('<section class="section" id="technologies">', '<section class="section" id="projects">')
                  if s != o:
                      open(p, 'w', encoding='utf-8').write(s)
                      changed += 1
          print('pages changed:', changed)
          PYEOF
          python3 "$RUNNER_TEMP/projects_move.py"

      - name: Commit and remove this one-off workflow
        run: |
          git rm -q .github/workflows/projects-move.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move /technologies/ to /projects/ (old address redirects)"
          git push
