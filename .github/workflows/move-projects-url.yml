name: One-off - move /technologies/ to /projects/

on:
  push:
    branches: [rename-technologies-projects]
    paths: ['.github/workflows/move-projects-url.yml']

jobs:
  move:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Move the page and update every link
        run: |
          git mv technologies projects
          files=$(grep -rl --include=*.html 'technologies/"' . || true)
          sed -i 's#href="\(\(\.\./\)*\)technologies/"#href="\1projects/"#g' $files
          sed -i 's/<section class="section" id="technologies">/<section class="section" id="projects">/' index.html projects/index.html
          mkdir -p technologies
          cat > technologies/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>Projects — Arthemii Ionaere</title>
              <meta name="robots" content="noindex">
              <link rel="canonical" href="https://arthemii.com/projects/">
              <meta http-equiv="refresh" content="0; url=../projects/">
              <script>location.replace('../projects/' + location.hash);</script>
          </head>
          <body>
              <p>This page has moved to <a href="../projects/">Projects</a>.</p>
          </body>
          </html>
          HTML
          sed -i 's/^          //' technologies/index.html

      - name: Commit and remove this one-off workflow
        run: |
          git rm -q .github/workflows/move-projects-url.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move /technologies/ to /projects/ (old address redirects)"
          git push
